<!DOCTYPE html>
<html>
<head>
    <title>drawio AI Editor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="styles/grapheditor.css">
    <script src="js/bootstrap.js"></script>
    <style>
        #diagram-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            background: #2a2a2a; color: #fff; padding: 5px 12px;
            font-family: Arial, sans-serif; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid #555;
        }
        #diagram-bar select { background:#444; color:#fff; border:1px solid #666; padding:2px 8px; border-radius:3px; }
        #diagram-bar button { background:#d89000; color:#fff; border:none; padding:3px 10px; border-radius:3px; cursor:pointer; }
        #diagram-bar .msg { font-size:11px; margin-left:auto; }
        body.geEditor { padding-top: 30px; }
        #geInfo { display:none; }
    </style>
</head>
<body class="geEditor geClassic">
    <div id="diagram-bar">
        <span>📐</span>
        <select id="file-select"><option value="">Loading...</option></select>
        <button id="load-btn">Load</button>
        <span id="status" class="msg">Ready</span>
    </div>
    <div id="geInfo"><div class="geBlock"><h2 id="geStatus">Loading...</h2></div></div>
    <script src="js/main.js"></script>
    <script>
    (function() {
        var LS_FILE = 'drawio_last_file';
        var sel = document.getElementById('file-select');
        var status = document.getElementById('status');
        var editorUi = null;

        function refreshList() {
            fetch('/api/diagrams').then(function(r){return r.json()}).then(function(resp){
                if (!resp.success) return;
                sel.innerHTML = '<option value="">Select</option>';
                resp.data.forEach(function(f) {
                    var o = document.createElement('option');
                    o.value = f.name; o.textContent = f.name;
                    sel.appendChild(o);
                });
            });
        }

        function loadFile(name) {
            if (!name || !editorUi) { status.textContent = 'Editor not ready'; return; }
            status.textContent = 'Loading ' + name + '...';
            fetch('/api/diagrams/' + encodeURIComponent(name))
                .then(function(r){return r.json()})
                .then(function(resp){
                    if (!resp.success) throw new Error('API error');
                    var doc = mxUtils.parseXml(resp.data.xml);
                    editorUi.editor.setGraphXml(doc.documentElement);
                    localStorage.setItem(LS_FILE, name);
                    sel.value = name;
                    status.textContent = '✓ ' + name;
                })
                .catch(function(e){ status.textContent = 'Error: ' + e.message; });
        }

        document.getElementById('load-btn').onclick = function() { loadFile(sel.value); };

        // Polling auto-refresh
        var lastTs = JSON.parse(localStorage.getItem('drawio_timestamps') || '{}');
        setInterval(function() {
            fetch('/api/diagrams').then(function(r){return r.json()}).then(function(resp){
                if (!resp.success) return;
                var changed = false;
                resp.data.forEach(function(f) {
                    var ts = new Date(f.modified).getTime();
                    if (lastTs[f.name] && lastTs[f.name] !== ts) changed = true;
                    lastTs[f.name] = ts;
                });
                localStorage.setItem('drawio_timestamps', JSON.stringify(lastTs));
                if (changed) {
                    var cur = localStorage.getItem(LS_FILE);
                    if (cur) { loadFile(cur); } else { window.location.reload(); }
                }
            }).catch(function(){});
        }, 2000);

        // Get editor UI via Draw.loadPlugin callback
        refreshList();
        var fileToLoad = new URLSearchParams(window.location.search).get('file') || localStorage.getItem(LS_FILE);

        var waitTimer = setInterval(function() {
            if (window.editorUi) {
                editorUi = window.editorUi;
                clearInterval(waitTimer);
                status.textContent = 'Editor loaded';
                if (fileToLoad) {
                    setTimeout(function() { sel.value = fileToLoad; loadFile(fileToLoad); }, 500);
                }
            } else if (window.Draw && window.Draw.loadPlugin && typeof window.Draw.loadPlugin === 'function') {
                try {
                    Draw.loadPlugin(function(ui) { window.editorUi = ui; });
                } catch(e) {}
            }
        }, 500);

        // Timeout after 60s
        setTimeout(function() {
            if (!editorUi) status.textContent = 'Timed out. Click Load manually.';
        }, 60000);
    })();
    </script>
</body>
</html>
