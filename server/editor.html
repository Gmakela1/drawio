<!DOCTYPE html>
<html>
<head>
    <title>drawio AI Editor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="styles/grapheditor.css">
    <script src="js/bootstrap.js"></script>
    <style>
        #diagram-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            background: #2a2a2a; color: #fff; padding: 5px 12px;
            font-family: Arial, sans-serif; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid #555;
        }
        #diagram-bar select { background:#444; color:#fff; border:1px solid #666; padding:2px 8px; border-radius:3px; }
        #diagram-bar button { background:#d89000; color:#fff; border:none; padding:3px 10px; border-radius:3px; cursor:pointer; }
        #diagram-bar .msg { font-size:11px; margin-left:auto; }
        body.geEditor { padding-top: 30px; }
        #geInfo { display:none; }
    </style>
</head>
<body class="geEditor geClassic">
    <div id="diagram-bar">
        <span>📐</span>
        <select id="file-select"><option value="">Loading...</option></select>
        <button id="load-btn">Load</button>
        <span id="status" class="msg">Ready</span>
    </div>
    <div id="geInfo"><div class="geBlock"><h2 id="geStatus">Loading...</h2></div></div>
    <script src="js/main.js"></script>
    <script>
    (function() {
        var LS_KEY = 'drawio_last_file';
        var sel = document.getElementById('file-select');
        var status = document.getElementById('status');
        var editorUi = null;

        function refreshList() {
            fetch('/api/diagrams').then(function(r){return r.json()}).then(function(resp){
                if (!resp.success) return;
                sel.innerHTML = '<option value="">Select</option>';
                resp.data.forEach(function(f) {
                    var o = document.createElement('option');
                    o.value = f.name; o.textContent = f.name;
                    sel.appendChild(o);
                });
            });
        }

        function setMsg(text, color) {
            status.textContent = text;
            status.style.color = color || '#8f8';
        }

        function loadFile(name) {
            if (!name || !editorUi) { setMsg('Editor not ready', '#f88'); return; }
            setMsg('Loading ' + name + '...', '#ff8');
            fetch('/api/diagrams/' + encodeURIComponent(name))
                .then(function(r){return r.json()})
                .then(function(resp){
                    if (!resp.success) throw new Error('API error');
                    var doc = mxUtils.parseXml(resp.data.xml);
                    editorUi.editor.setGraphXml(doc.documentElement);
                    editorUi.currentFile = { setData: function(d){this.data=d;}, data: resp.data.xml, title: name };
                    localStorage.setItem(LS_KEY, name);
                    sel.value = name;
                    setMsg('✓ ' + name);
                })
                .catch(function(e){ setMsg(e.message, '#f88'); });
        }

        // Watch for diagram changes -> auto-reload file
        var sse = new EventSource('/api/watch');
        sse.onmessage = function(e) {
            try {
                var d = JSON.parse(e.data);
                if (d.event === 'reload' && d.file === localStorage.getItem(LS_KEY)) {
                    setMsg('↻ Reloading...', '#ff8');
                    loadFile(d.file);
                }
            } catch(ex) {}
        };

        document.getElementById('load-btn').onclick = function() { loadFile(sel.value); };

        // Wait for editor by polling Draw.loadPlugin
        refreshList();
        var fileToLoad = new URLSearchParams(window.location.search).get('file') || localStorage.getItem(LS_KEY);

        var waitCount = 0;
        var waitTimer = setInterval(function() {
            waitCount++;
            // The App constructor sets Draw.loadPlugin to a bound function
            // that receives the editor UI as its 'this' context
            if (window.Draw && window.Draw.loadPlugin && window.editorUi === undefined) {
                try {
                    Draw.loadPlugin(function(ui) {
                        window.editorUi = ui;
                        editorUi = ui;
                    });
                } catch(e) {}
            }
            if (editorUi) {
                clearInterval(waitTimer);
                setMsg('Editor loaded');
                if (fileToLoad) {
                    setTimeout(function() { sel.value = fileToLoad; loadFile(fileToLoad); }, 500);
                }
            } else if (waitCount > 100) {
                clearInterval(waitTimer);
                setMsg('Timed out. Click Load manually.', '#f88');
            }
        }, 500);
    })();
    </script>
</body>
</html>
